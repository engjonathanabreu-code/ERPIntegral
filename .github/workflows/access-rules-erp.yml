name: Regras de acesso ERP
on:
  push:
    branches: [access-rules-erp]
    paths:
      - .github/patch_access_roles.py
      - .github/workflows/access-rules-erp.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: access-rules-erp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar regras no código fonte
        run: python3 .github/patch_access_roles.py
      - name: Validar JavaScript e build
        run: |
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
          cd ERP-INTEGRAL-4.0-SUPABASE-MIGRADO && npm run build
      - name: Gravar alteração definitiva
        run: |
          rm -f .github/patch_access_roles.py .github/workflows/access-rules-erp.yml
          git config user.name "Integral ERP Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js .github/patch_access_roles.py .github/workflows/access-rules-erp.yml
          git commit -m "feat: restringe abas por setor e função"
          git push origin access-rules-erp
