name: Organizar Andamentos no codigo fonte
on:
  push:
    branches:
      - main
    paths:
      - tools/_temp_andamentos_source.py
      - .github/workflows/andamentos-by-type-source.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar no codigo fonte
        run: python3 tools/_temp_andamentos_source.py
      - name: Validar JavaScript
        run: node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
      - name: Gravar alteracao
        run: |
          git config user.name "Integral ERP"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: organiza andamentos por tipo e progresso"
          git push
