name: Restore complete Metas source once
on:
  push:
    paths:
      - '.github/workflows/restore-complete-metas-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar Metas no codigo fonte
        run: |
          set -e
          python scripts/restore_complete_metas.py
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          grep -q 'Ordens de Serviço' ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          grep -q 'Metas ativas' ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          grep -q 'Checklist' ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          grep -q 'Observações' ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          rm -f scripts/restore_complete_metas.py .github/workflows/restore-complete-metas-once.yml
          git config user.name 'Integral Metas Source Restore'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restaurar funcionalidades completas da aba Metas no fonte'
          git push
