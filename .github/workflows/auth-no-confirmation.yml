name: Autenticacao ERP sem email de confirmacao
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auth-no-confirmation.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar no codigo fonte
        run: python3 .github/patch_auth_no_email.py
      - name: Validar
        run: |
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/api/admin-user-create.js
          cd ERP-INTEGRAL-4.0-SUPABASE-MIGRADO && npm run build
      - name: Commit definitivo
        run: |
          rm -f .github/patch_auth_no_email.py .github/workflows/auth-no-confirmation.yml
          git config user.name "Integral ERP Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/api/admin-user-create.js .github/patch_auth_no_email.py .github/workflows/auth-no-confirmation.yml
          git commit -m "feat: cria usuarios sem exigir confirmacao de email"
          git push
