name: Fix metas CRUD once

on:
  push:
    paths:
      - '.github/workflows/fix-metas-crud-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir permissões e atualização do módulo Metas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js')
          s=p.read_text()
          old="const isType=(...types)=>types.some(t=>String(currentUser()?.type||'').toLowerCase()===String(t).toLowerCase());"
          new="const roleName=()=>String(currentUser()?.type||currentUser()?.role||document.querySelector('.topbar .badge')?.textContent||document.querySelector('.user-mini')?.textContent||'').trim();\nconst isType=(...types)=>{const r=roleName().toLowerCase();return types.some(t=>r===String(t).toLowerCase()||r.includes(String(t).toLowerCase()));};"
          if old not in s: raise SystemExit('role helper not found')
          s=s.replace(old,new,1)

          # Recarrega perfis/projetos/planos antes de abrir formulários administrativos.
          s=s.replace("function metaModal(prefill=null,defaultUserId=null){", "async function metaModal(prefill=null,defaultUserId=null){if(B()?.refreshCore)await B().refreshCore();",1)
          s=s.replace("async function sectorModal(s={}){", "async function sectorModal(s={}){if(B()?.refreshCore)await B().refreshCore();",1)
          s=s.replace("function orderModal(o={}){", "async function orderModal(o={}){if(B()?.refreshCore)await B().refreshCore();",1)

          # Após CRUD, refaz leitura real do Supabase para evitar tela/cache desatualizados.
          s=s.replace("B().closeModal();renderOrders()}}", "B().closeModal();await fetchAll();renderOrders()}}",1)
          s=s.replace("B().closeModal();renderActive()}}", "B().closeModal();await fetchAll();renderActive()}}",1)
          s=s.replace("state.orders=state.orders.filter(o=>o.id!==id);renderOrders()}", "state.orders=state.orders.filter(o=>o.id!==id);await fetchAll();renderOrders()}",1)
          s=s.replace("state.sectors=state.sectors.filter(s=>s.id!==id);renderActive()}", "state.sectors=state.sectors.filter(s=>s.id!==id);await fetchAll();renderActive()}",1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          git commit -m "fix: tornar CRUD de metas e OS operacional" || exit 0
          git push
