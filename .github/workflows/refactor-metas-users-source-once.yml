name: Refactor ERP source once

on:
  push:
    paths:
      - '.github/workflows/refactor-metas-users-source-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source refactor
        run: python scripts/refactor_erp_source.py
      - name: Commit source changes
        run: |
          git rm -f ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-hotfix-v8.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-conclusion-approval.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-init-fix.js || true
          git rm -f scripts/refactor_erp_source.py
          git rm -f .github/workflows/refactor-metas-users-source-once.yml
          git config user.name "Integral Source Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidar Metas e remodelar Usuarios no codigo fonte"
          git push
