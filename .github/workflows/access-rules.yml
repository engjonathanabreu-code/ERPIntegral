name: Ajustar acessos ERP por setor e funcao
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/access-rules.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar regras no codigo fonte
        run: python3 .github/patch_access_rules.py
      - name: Validar JavaScript e build
        run: |
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/erp-bridge.js
          cd ERP-INTEGRAL-4.0-SUPABASE-MIGRADO && npm run build
      - name: Commit definitivo
        run: |
          rm -f .github/patch_access_rules.py .github/workflows/access-rules.yml
          git config user.name "Integral ERP Access Control"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/erp-bridge.js .github/patch_access_rules.py .github/workflows/access-rules.yml
          git commit -m "feat: restringe abas por setor e funcao"
          git push
