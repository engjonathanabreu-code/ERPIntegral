name: Fix metas flicker once
on:
  push:
    paths:
      - '.github/workflows/fix-metas-flicker-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir loop de renderização
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js')
          s=p.read_text()
          old="const observer=new MutationObserver(()=>installEntityHistoryHooks());observer.observe(document.documentElement,{childList:true,subtree:true});\n\nasync function render(){renderLoading();if(B()?.refreshCore)await B().refreshCore();await fetchAll();if(B()?.currentView!=='metas')return;if(state.error){renderSetupError();return;}renderCurrentScreen();installEntityHistoryHooks();}"
          new="let historyHookTimer=null;\nconst observer=new MutationObserver(()=>{\n  if(historyHookTimer)return;\n  historyHookTimer=setTimeout(()=>{historyHookTimer=null;installEntityHistoryHooks();},120);\n});\nobserver.observe(document.querySelector('#app')||document.body,{childList:true,subtree:true});\n\nlet renderPromise=null;\nasync function render(){\n  if(renderPromise)return renderPromise;\n  renderPromise=(async()=>{\n    const firstLoad=!state.loaded;\n    if(firstLoad)renderLoading();\n    if(B()?.refreshCore)await B().refreshCore();\n    await fetchAll();\n    if(B()?.currentView!=='metas')return;\n    if(state.error){renderSetupError();return;}\n    renderCurrentScreen();\n    installEntityHistoryHooks();\n  })().finally(()=>{renderPromise=null;});\n  return renderPromise;\n}"
          if old not in s:
              raise SystemExit('Trecho alvo não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          idx=Path('ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/index.html')
          h=idx.read_text().replace('metas-v2.js?v=19','metas-v2.js?v=20').replace('metas-v2.js?v=18','metas-v2.js?v=20')
          idx.write_text(h)
          PY
          node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/metas-v2.js
          rm .github/workflows/fix-metas-flicker-once.yml
          git config user.name 'engjonathanabreu-code'
          git config user.email 'eng.jonathanabreu@gmail.com'
          git add -A
          git commit -m 'fix: eliminar loop de renderização da aba Metas'
          git push