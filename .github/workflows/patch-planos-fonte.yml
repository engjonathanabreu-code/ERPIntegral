name: patch-planos-fonte

"on":
  push:
    paths:
      - '.github/workflows/patch-planos-fonte.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/patch_planos.py
      - run: node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
      - run: |
          git config user.name "Integral ERP Source Patch"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/styles.css ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/index.html
          git commit -m "fix: implementar mini menus de planos direto no fonte"
          git push origin main
