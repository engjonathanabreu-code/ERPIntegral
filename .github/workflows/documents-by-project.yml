name: Organizar documentos por projeto
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/documents-by-project.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar código-fonte do ERP
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Validar JavaScript
        run: node --check ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js
      - name: Gravar alteração definitiva
        run: |
          rm -f .github/workflows/documents-by-project.yml
          git config user.name "Integral ERP"
          git config user.email "actions@users.noreply.github.com"
          git add ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/app.js ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/styles.css ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/index.html .github/workflows/documents-by-project.yml
          git commit -m "feat: agrupa documentos por projeto"
          git push
