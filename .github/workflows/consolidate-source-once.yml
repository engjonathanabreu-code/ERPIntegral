name: Consolidate ERP source once

on:
  push:
    paths:
      - '.github/workflows/consolidate-source-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidar codigo fonte
        run: python scripts/consolidate_source.py
      - name: Remover patches e arquivos temporarios
        run: |
          rm -f ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/account-security.js
          rm -f ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/financeiro-sector.js
          rm -f ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/meta-collaboration.js
          rm -f ERP-INTEGRAL-4.0-SUPABASE-MIGRADO/public/erp-ui-enhancements.js
          rm -f .github/workflows/fix-metas-crud-once.yml
          rm -f .github/workflows/upgrade-metas-v2-once.yml
          rm -f scripts/consolidate_source.py
          rm -f .github/workflows/consolidate-source-once.yml
          git config user.name "Integral Source Consolidation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidar atualizacoes no codigo fonte do ERP"
          git push
